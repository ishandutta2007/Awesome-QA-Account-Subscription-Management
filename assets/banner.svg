<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.85" />
    </linearGradient>

    <!-- Text Gradient for Title -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Filter for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Background animated elements */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(20px, -10px); opacity: 0.7; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes signalPulse {
      0% { r: 3px; opacity: 1; }
      100% { r: 9px; opacity: 0; }
    }

    .orb-1 { animation: pulseOrb 7s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 9s ease-in-out infinite alternate; transform-origin: 1000px 250px; }
    .card-anim-1 { animation: floatCard1 5s ease-in-out infinite; }
    .card-anim-2 { animation: floatCard2 6s ease-in-out infinite; }
    .conn-line { stroke: #3b82f6; stroke-width: 1.5; stroke-dasharray: 4, 4; animation: dashMove 3s linear infinite; }
    .pulse-ring { animation: signalPulse 2s ease-out infinite; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Blobs in Background -->
  <circle class="orb-1" cx="220" cy="110" r="140" fill="url(#glowGrad1)" filter="url(#glow)" />
  <circle class="orb-2" cx="980" cy="240" r="160" fill="url(#glowGrad2)" filter="url(#glow)" />

  <!-- Decorative Matrix / Tech Grid Points (Background) -->
  <g opacity="0.15">
    <circle cx="100" cy="60" r="1.5" fill="#93c5fd" />
    <circle cx="200" cy="60" r="1.5" fill="#93c5fd" />
    <circle cx="300" cy="60" r="1.5" fill="#93c5fd" />
    <circle cx="400" cy="60" r="1.5" fill="#93c5fd" />
    <circle cx="500" cy="60" r="1.5" fill="#93c5fd" />
    <circle cx="600" cy="60" r="1.5" fill="#93c5fd" />
    <circle cx="700" cy="60" r="1.5" fill="#93c5fd" />
    <circle cx="800" cy="60" r="1.5" fill="#93c5fd" />
    <circle cx="900" cy="60" r="1.5" fill="#93c5fd" />
    <circle cx="1000" cy="60" r="1.5" fill="#93c5fd" />
    <circle cx="1100" cy="60" r="1.5" fill="#93c5fd" />
    <circle cx="100" cy="300" r="1.5" fill="#93c5fd" />
    <circle cx="200" cy="300" r="1.5" fill="#93c5fd" />
    <circle cx="300" cy="300" r="1.5" fill="#93c5fd" />
    <circle cx="400" cy="300" r="1.5" fill="#93c5fd" />
    <circle cx="500" cy="300" r="1.5" fill="#93c5fd" />
    <circle cx="600" cy="300" r="1.5" fill="#93c5fd" />
    <circle cx="700" cy="300" r="1.5" fill="#93c5fd" />
    <circle cx="800" cy="300" r="1.5" fill="#93c5fd" />
    <circle cx="900" cy="300" r="1.5" fill="#93c5fd" />
    <circle cx="1000" cy="300" r="1.5" fill="#93c5fd" />
    <circle cx="1100" cy="300" r="1.5" fill="#93c5fd" />
  </g>

  <!-- Dynamic Connecting Network Curves in Background -->
  <path class="conn-line" d="M 80,180 C 300,100 450,260 600,180 C 750,100 900,260 1120,180" fill="none" opacity="0.35" />

  <!-- Animated Floating Accent Card: Left Side (Device Slots / Testing) -->
  <g class="card-anim-1" transform="translate(60, 60)" opacity="0.85">
    <rect width="180" height="74" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
    <circle cx="26" cy="37" r="6" fill="#10b981" />
    <circle class="pulse-ring" cx="26" cy="37" r="6" stroke="#10b981" stroke-width="1.5" fill="none" />
    <text x="44" y="32" fill="#9ca3af" font-size="11" font-weight="500">CONCURRENT SLOTS</text>
    <text x="44" y="52" fill="#f3f4f6" font-size="16" font-weight="700">99.98% Up</text>
  </g>

  <!-- Animated Floating Accent Card: Right Side (Billing & Seats) -->
  <g class="card-anim-2" transform="translate(960, 220)" opacity="0.85">
    <rect width="180" height="74" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
    <circle cx="26" cy="37" r="6" fill="#8b5cf6" />
    <circle class="pulse-ring" cx="26" cy="37" r="6" stroke="#8b5cf6" stroke-width="1.5" fill="none" />
    <text x="44" y="32" fill="#9ca3af" font-size="11" font-weight="500">SUBSCRIPTION TIER</text>
    <text x="44" y="52" fill="#f3f4f6" font-size="15" font-weight="700">Enterprise Cloud</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Tags (Always Visible & Prominent) -->
  <g text-anchor="middle">
    <!-- Top Category Pill -->
    <rect x="475" y="45" width="250" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.9" />
    <text x="600" y="65" fill="#60a5fa" font-size="12" font-weight="600" letter-spacing="1.5">TESTING &amp; CLOUD INFRASTRUCTURE</text>

    <!-- Main Title -->
    <text x="600" y="142" fill="url(#textGrad)" font-size="36" font-weight="800" letter-spacing="-0.5">
      QA Account &amp; Subscription Management
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="185" fill="#e2e8f0" font-size="16" font-weight="500">
      Curated Directory of QA Device Clouds, Concurrency Slots, Billing Portals &amp; Open-Source Engines
    </text>

    <!-- Subtitle Line 2 -->
    <text x="600" y="214" fill="#94a3b8" font-size="13">
      Cross-Browser Testing Clouds • Usage-Based Metering • Seat Licenses • Open-Source Invoicing
    </text>

    <!-- Interactive Badges Pill Row -->
    <g transform="translate(360, 255)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="34" rx="17" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
      <text x="70" y="22" fill="#e5e7eb" font-size="12" font-weight="500">⚡ SaaS Platforms</text>

      <!-- Pill 2 -->
      <rect x="170" y="0" width="140" height="34" rx="17" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
      <text x="240" y="22" fill="#e5e7eb" font-size="12" font-weight="500">💎 Open Source</text>

      <!-- Pill 3 -->
      <rect x="340" y="0" width="140" height="34" rx="17" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
      <text x="410" y="22" fill="#e5e7eb" font-size="12" font-weight="500">📊 Pricing &amp; Limits</text>
    </g>
  </g>
</svg>